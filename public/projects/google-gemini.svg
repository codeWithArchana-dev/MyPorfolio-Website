<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Google Gemini clone chat interface preview">
  <defs>
    <linearGradient id="greet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4b7bec"/>
      <stop offset="50%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#e8618c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#ffffff"/>

  <!-- sidebar -->
  <rect width="168" height="500" fill="#f0f4f9"/>
  <g fill="#5f6368">
    <rect x="22" y="24" width="18" height="2.6" rx="1.3"/>
    <rect x="22" y="31" width="18" height="2.6" rx="1.3"/>
    <rect x="22" y="38" width="18" height="2.6" rx="1.3"/>
  </g>
  <rect x="22" y="64" width="96" height="34" rx="17" fill="#dde3ea"/>
  <text x="40" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#444746">+ New chat</text>
  <text x="22" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#444746">Recent</text>
  <g fill="#c8d0da">
    <rect x="22" y="152" width="118" height="8" rx="4"/>
    <rect x="22" y="176" width="100" height="8" rx="4"/>
    <rect x="22" y="200" width="112" height="8" rx="4"/>
  </g>

  <!-- top bar -->
  <text x="196" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#5f6368">Gemini</text>
  <circle cx="762" cy="34" r="15" fill="#c7d7f2"/>
  <text x="762" y="39" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3b5ea8" text-anchor="middle">A</text>

  <!-- greeting -->
  <text x="196" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="url(#greet)">Hello, Archana</text>
  <text x="196" y="166" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#c4c7c5">How can I help You today?</text>

  <!-- suggestion cards -->
  <g>
    <rect x="196" y="212" width="132" height="132" rx="14" fill="#f0f4f9"/>
    <rect x="212" y="230" width="94" height="7" rx="3.5" fill="#c8d0da"/>
    <rect x="212" y="246" width="82" height="7" rx="3.5" fill="#c8d0da"/>
    <rect x="212" y="262" width="60" height="7" rx="3.5" fill="#c8d0da"/>
    <circle cx="300" cy="320" r="14" fill="#ffffff"/>
  </g>
  <g>
    <rect x="342" y="212" width="132" height="132" rx="14" fill="#f0f4f9"/>
    <rect x="358" y="230" width="94" height="7" rx="3.5" fill="#c8d0da"/>
    <rect x="358" y="246" width="76" height="7" rx="3.5" fill="#c8d0da"/>
    <rect x="358" y="262" width="88" height="7" rx="3.5" fill="#c8d0da"/>
    <circle cx="446" cy="320" r="14" fill="#ffffff"/>
  </g>
  <g>
    <rect x="488" y="212" width="132" height="132" rx="14" fill="#f0f4f9"/>
    <rect x="504" y="230" width="94" height="7" rx="3.5" fill="#c8d0da"/>
    <rect x="504" y="246" width="88" height="7" rx="3.5" fill="#c8d0da"/>
    <rect x="504" y="262" width="54" height="7" rx="3.5" fill="#c8d0da"/>
    <circle cx="592" cy="320" r="14" fill="#ffffff"/>
  </g>
  <g>
    <rect x="634" y="212" width="132" height="132" rx="14" fill="#f0f4f9"/>
    <rect x="650" y="230" width="94" height="7" rx="3.5" fill="#c8d0da"/>
    <rect x="650" y="246" width="70" height="7" rx="3.5" fill="#c8d0da"/>
    <rect x="650" y="262" width="86" height="7" rx="3.5" fill="#c8d0da"/>
    <circle cx="738" cy="320" r="14" fill="#ffffff"/>
  </g>

  <!-- prompt input -->
  <rect x="196" y="392" width="570" height="50" rx="25" fill="#f0f4f9"/>
  <text x="222" y="423" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" fill="#9aa0a6">Enter a prompt here</text>
  <circle cx="668" cy="417" r="11" fill="#d3dae3"/>
  <circle cx="702" cy="417" r="11" fill="#d3dae3"/>
  <circle cx="736" cy="417" r="11" fill="#d3dae3"/>

  <text x="481" y="470" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#9aa0a6" text-anchor="middle">Gemini may display inaccurate info, including about people — double check its responses.</text>
</svg>
