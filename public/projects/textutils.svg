<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="TextUtils text analysis app interface preview">
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- navbar -->
  <rect width="800" height="54" fill="#212529"/>
  <text x="30" y="33" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">TextUtils</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#c7ccd1">
    <text x="122" y="33">About</text>
    <text x="176" y="33">Contact</text>
  </g>
  <rect x="470" y="14" width="150" height="26" rx="5" fill="#ffffff" opacity="0.12"/>
  <text x="484" y="32" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#9aa3ab">Search</text>
  <rect x="632" y="16" width="22" height="22" rx="11" fill="#3d4348"/>
  <circle cx="639" cy="27" r="7" fill="#f8f9fa"/>
  <text x="664" y="32" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#c7ccd1">Dark Mode</text>

  <!-- heading -->
  <text x="40" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#212529">Enter the text to analyze below</text>

  <!-- textarea -->
  <rect x="40" y="116" width="720" height="132" rx="7" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
  <g fill="#dee2e6">
    <rect x="58" y="138" width="520" height="9" rx="4.5"/>
    <rect x="58" y="160" width="640" height="9" rx="4.5"/>
    <rect x="58" y="182" width="452" height="9" rx="4.5"/>
    <rect x="58" y="204" width="596" height="9" rx="4.5"/>
  </g>

  <!-- action buttons -->
  <rect x="40" y="266" width="122" height="36" rx="6" fill="#0d6efd"/>
  <text x="101" y="289" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Uppercase</text>

  <rect x="174" y="266" width="122" height="36" rx="6" fill="#0d6efd"/>
  <text x="235" y="289" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Lowercase</text>

  <rect x="308" y="266" width="134" height="36" rx="6" fill="#0d6efd"/>
  <text x="375" y="289" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Remove Spaces</text>

  <rect x="454" y="266" width="104" height="36" rx="6" fill="#6c757d"/>
  <text x="506" y="289" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Clear Text</text>

  <rect x="570" y="266" width="96" height="36" rx="6" fill="#6c757d"/>
  <text x="618" y="289" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Copy</text>

  <!-- summary -->
  <text x="40" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#212529">Your text summary</text>

  <rect x="40" y="366" width="232" height="62" rx="8" fill="#f1f3f5"/>
  <text x="60" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#0d6efd">248</text>
  <text x="60" y="412" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#6c757d">words</text>

  <rect x="284" y="366" width="232" height="62" rx="8" fill="#f1f3f5"/>
  <text x="304" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#0d6efd">1,486</text>
  <text x="304" y="412" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#6c757d">characters</text>

  <rect x="528" y="366" width="232" height="62" rx="8" fill="#f1f3f5"/>
  <text x="548" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#0d6efd">0.74</text>
  <text x="548" y="412" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#6c757d">minutes to read</text>

  <text x="40" y="462" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#495057">Preview</text>
</svg>
